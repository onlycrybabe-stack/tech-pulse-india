<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="tpi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>
    <linearGradient id="tpi-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="tpi-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#tpi-bg)" stroke="#334155" stroke-width="1.2" />

  <!-- India Tricolor Accent Bar on Top -->
  <rect x="13" y="4" width="7" height="2" rx="1" fill="#FF9933" />
  <rect x="20.5" y="4" width="7" height="2" rx="1" fill="#FFFFFF" />
  <rect x="28" y="4" width="7" height="2" rx="1" fill="#10B981" />

  <!-- Grid Guide Accent -->
  <line x1="8" y1="24" x2="40" y2="24" stroke="#334155" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>

  <!-- High-Tech Dynamic Pulse Wave -->
  <path d="M7 24H14L18 13L24 35L29 20L33 26H41" 
        stroke="url(#tpi-pulse)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#tpi-glow)" />

  <!-- Pulsing Peak Accent Nodes -->
  <circle cx="18" cy="13" r="2.2" fill="#FF9933" />
  <circle cx="24" cy="35" r="2.2" fill="#38BDF8" />
  <circle cx="29" cy="20" r="2" fill="#10B981" />
</svg>
