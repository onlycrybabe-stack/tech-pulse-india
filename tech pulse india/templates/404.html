{% extends "base.html" %}

{% block title %}404 - Article Not Found | Tech Pulse India{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-24 text-center">
    <div class="w-16 h-16 rounded-2xl bg-cyan-950/50 border border-cyan-800/50 flex items-center justify-center mx-auto mb-6 text-cyan-400">
        <i data-lucide="alert-triangle" class="w-8 h-8"></i>
    </div>
    <h1 class="text-3xl font-bold text-white mb-3">Post Not Found / लेख नहीं मिला</h1>
    <p class="text-slate-400 text-sm mb-8">
        The tech article you are looking for does not exist or may have been moved.
    </p>
    <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-white text-xs font-semibold shadow-lg shadow-cyan-500/20 transition-all">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>Return to Home / मुख्य पृष्ठ पर लौटें</span>
    </a>
</div>
{% endblock %}
